<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools — Shortnur</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🔗</text></svg>">
    <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
  <div class="aurora"></div>
  <div class="grid-overlay"></div>

  <div class="loading-screen" id="loadingScreen">
    <div class="logo-icon">🔗</div>
    <div class="spinner"></div>
  </div>

  <div class="dash-layout hidden" id="appRoot">
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="logo">
        <div class="logo-icon">🔗</div>
        <span>Short<b>nur</b></span>
      </a>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-page="overview"><span class="nav-icon" data-icon="dashboard"></span><span>Overview</span></a>
        <a href="dashboard.html#links" class="nav-item" data-page="links"><span class="nav-icon" data-icon="link"></span><span>My Links</span></a>
        <a href="analytics.html" class="nav-item" data-page="analytics"><span class="nav-icon" data-icon="chart"></span><span>Analytics</span></a>
        <a href="earnings.html" class="nav-item" data-page="earnings"><span class="nav-icon" data-icon="wallet"></span><span>Earnings</span></a>
        <a href="referrals.html" class="nav-item" data-page="referrals"><span class="nav-icon" data-icon="users"></span><span>Referrals</span></a>
        <a href="tools.html" class="nav-item active" data-page="tools"><span class="nav-icon" data-icon="tools"></span><span>Tools</span></a>
        <a href="settings.html" class="nav-item" data-page="settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebarUser">
          <div class="avatar" id="userAvatar">?</div>
          <div class="user-meta"><b id="userName">Loading...</b><span id="userPlan">Free plan</span></div>
        </div>
        <button class="btn btn-ghost btn-block" id="logoutBtn"><span data-icon="log-out"></span> Logout</button>
      </div>
    </aside>

    <main class="dash-main">
      <div class="dash-topbar">
        <div class="flex">
          <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
          <span class="page-icon c-amber" data-icon="tools"></span>
          <div>
            <h1>Tools</h1>
            <div class="sub">Bonus utilities for power users</div>
          </div>
        </div>
      </div>

      <!-- QR Code Generator -->
      <div class="card mb-3">
        <div class="card-header">
          <h3>QR Code Generator</h3>
          <span class="text-muted">Generate QR for any link</span>
        </div>
        <div class="flex-between" style="align-items:flex-start;">
          <div style="flex:1;">
            <div class="form-group">
              <label for="qrUrl">URL</label>
              <input type="url" id="qrUrl" class="form-control form-control-plain" placeholder="https://your-link.com">
            </div>
            <button class="btn btn-primary" id="qrGenerateBtn">Generate QR</button>
          </div>
          <div style="text-align:center;">
            <div id="qrPlaceholder" class="text-muted" style="width:180px;height:180px;display:grid;place-items:center;border:2px dashed var(--dark-border);border-radius:16px;">QR will appear here</div>
            <div id="qrResult" class="hidden" style="width:180px;height:180px;background:#fff;border-radius:16px;padding:10px;display:grid;place-items:center;"></div>
            <button class="btn btn-ghost btn-sm mt-1 hidden" id="qrDownloadBtn"><span data-icon="download"></span> Download</button>
          </div>
        </div>
      </div>

      <!-- Bulk Shorten -->
      <div class="card">
        <div class="card-header">
          <h3>Bulk URL Shortener</h3>
          <span class="text-muted">Shorten multiple links at once</span>
        </div>
        <div class="form-group">
          <label for="bulkUrls">Paste URLs (one per line)</label>
          <textarea id="bulkUrls" class="form-control form-control-plain" rows="6" placeholder="https://link1.com&#10;https://link2.com&#10;https://link3.com"></textarea>
        </div>
        <button class="btn btn-primary mb-3" id="bulkShortenBtn"><span data-icon="zap"></span> Shorten All</button>
        <div id="bulkResults" class="hidden">
          <div class="table-responsive">
            <table class="links-table">
              <thead><tr><th>Original</th><th>Short URL</th><th></th></tr></thead>
              <tbody id="bulkResultsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/tools.js"></script>
</body>
</html>
