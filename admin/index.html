<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — LINK BABA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🔗</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <div class="aurora"></div>
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <a href="../index.html" class="logo">
          <img src="assets/img/logo.png" class="logo-img" alt="LINK BABA">
          <span>LINK <b>BABA</b></span>
        </a>
        <span class="admin-badge">ADMIN</span>
      </div>

      <h2>Welcome back, Admin</h2>
      <p class="subtitle">Sign in to manage your platform.</p>

      <div class="alert alert-error" id="errorAlert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrap">
            <span class="input-icon" data-icon="mail"></span>
            <input type="email" id="email" class="form-control" placeholder="admin@linkbaba.online" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon" data-icon="lock"></span>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="togglePass" aria-label="Toggle password">
              <span data-icon="eye"></span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
        </button>
      </form>

      <div class="login-footer">
        <span data-icon="shield"></span> Restricted access — authorized admins only
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/index.js"></script>
</body>
</html>
